# ALSA configuration for the XDJ-RX3 player under WSL: no sound card. Both outputs are null devices;
# the preloaded shim captures the samples (/tmp/rx3-master.raw, /tmp/rx3-cue.raw: S16_LE 44.1 kHz stereo)
# and paces the audio thread at real time, since this alsa-lib's null plugin does not.
pcm.rx3out {
 type plug
 slave { pcm { type null } format S16_LE rate 44100 channels 2 }
}
pcm.rx3cue {
 type plug
 slave { pcm { type null } format S16_LE rate 44100 channels 2 }
}
