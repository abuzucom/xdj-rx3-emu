name: Immutable Compliance

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PR_BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
  PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
  PR_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
  PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
  PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  PR_AUTHOR: ${{ github.event.pull_request.user.login }}
  PR_REPO: pr-head
  TRUSTED_CHECKER: trusted-base/scripts/check_compliance_tree.py
  GIT_ALTERNATE_OBJECT_DIRECTORIES: ${{ github.workspace }}/trusted-base/.git/objects

jobs:
  immutable-compliance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the exact trusted base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ env.PR_BASE_REPOSITORY }}
          ref: ${{ env.PR_BASE_SHA }}
          path: trusted-base
          persist-credentials: false
          fetch-depth: 201
      - name: Check out the exact pull request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ env.PR_HEAD_REPOSITORY }}
          ref: ${{ env.PR_HEAD_SHA }}
          path: pr-head
          persist-credentials: false
          fetch-depth: 201
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.x'
      - name: Install trusted checker dependencies
        run: >-
          python -m pip install
          --requirement trusted-base/requirements-checkers.txt
      - name: Scan immutable pull request objects with the trusted checker
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python "$TRUSTED_CHECKER"
          --repo "$PR_REPO" --tree "$PR_HEAD_SHA"
          --base "$PR_BASE_SHA" --branch "$PR_HEAD_BRANCH"
          --pr-author "$PR_AUTHOR"
