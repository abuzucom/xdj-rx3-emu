name: Convention Sync Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests-windows:
    # The gates run as the launcher named in .claude/settings.json, which
    # only this job can prove resolves on Windows. A hook that fails to
    # start exits non-zero but not 2, which Claude Code treats as a
    # non-blocking error, so every gate would fail open there in silence.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Probe configured hook launchers
        run: python scripts/check_hook_launchers.py
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.x'
      - name: Install checker dependencies
        run: python -m pip install --requirement requirements-checkers.txt
      - name: Run tests
        run: python scripts/run_tests.py
      - name: Verify trusted GitHub CLI routing
        run: python -m unittest tests.test_trusted_gh tests.test_gate_parity -v

  tests-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Probe configured hook launchers
        run: python3 scripts/check_hook_launchers.py
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.x'
      - name: Install checker dependencies
        run: python -m pip install --requirement requirements-checkers.txt
      - name: Run tests
        run: python scripts/run_tests.py

  pr-authorship:
    # agents-md-compliance.yml stays push-only by design, so the pr-checks
    # job of the reusable agents-compliance.yml never runs here: its
    # pull_request condition is false on a push. These two checkers live
    # only in that job, so without this one they run on no event at all.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.x'
      - name: Check banned-agent authorship
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python scripts/check_banned_agents.py \
            --base "$PR_BASE_SHA" \
            --head "$PR_HEAD_SHA"
      - name: Check commit identities
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python scripts/check_git_identity.py \
            --base "$PR_BASE_SHA" \
            --head "$PR_HEAD_SHA"
      - name: Check strict commit attribution
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python scripts/check_commit_attribution.py
          --repo .
          --repository "${{ github.repository }}"
          --base "$PR_BASE_SHA"
          --head "$PR_HEAD_SHA"
      - name: Check commit messages for external references
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python scripts/check_external_pr_refs.py \
            --base "$PR_BASE_SHA" \
            --head "$PR_HEAD_SHA"

  check-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.x'
      - name: Install checker dependencies
        run: python -m pip install --requirement requirements-checkers.txt
      - name: Run sync check
        run: python scripts/sync.py --check
      - name: Check versioned changelog
        run: python scripts/check_changelog.py
      - name: Check changelog version advance
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.user.id != 49699333
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/check_changelog.py --base "$PR_BASE_SHA" --head "$PR_HEAD_SHA"
      - name: Check test-first executable changes
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/check_test_first.py --base "$PR_BASE_SHA" --head "$PR_HEAD_SHA"
      - name: Check canonical policy size
        run: python scripts/check_policy_size.py
      - name: Check gate adoption
        run: python scripts/check_gate_adoption.py
      - name: Check the shared gate files against the manifest
        run: python scripts/sync.py --check-shared
      - name: Run style lint
        run: python scripts/lint_style.py
      - name: Check worktree conflict markers (ordinary test)
        run: python scripts/check_conflict_markers.py
      - name: Check workflow action pins
        run: python scripts/check_action_pins.py
      - name: Check no untested statement entered the hooks
        run: python scripts/check_hook_coverage.py
      - name: Check American spelling (warning only)
        run: python scripts/check_us_spelling.py AGENTS.md README.md CHANGELOG.md docs/development.md docs/project-orientation.md docs/pr-security-review.md docs/pr-quality-review.md docs/template-drift.md plan/HANDOFF.md.example SECURITY.md CONTRIBUTING.md .github/PULL_REQUEST_TEMPLATE.md .github/ISSUE_TEMPLATE.md
      - name: Check English only (warning only)
        run: python scripts/check_english_only.py AGENTS.md README.md CHANGELOG.md docs/development.md docs/project-orientation.md docs/pr-security-review.md docs/pr-quality-review.md docs/template-drift.md plan/HANDOFF.md.example SECURITY.md CONTRIBUTING.md .github/PULL_REQUEST_TEMPLATE.md .github/ISSUE_TEMPLATE.md
      - name: Check prose policy (warning only)
        run: python scripts/check_hedging.py AGENTS.md CHANGELOG.md docs/development.md docs/project-orientation.md docs/pr-security-review.md docs/pr-quality-review.md docs/template-drift.md plan/HANDOFF.md.example SECURITY.md CONTRIBUTING.md .github/PULL_REQUEST_TEMPLATE.md .github/ISSUE_TEMPLATE.md
      - name: Check pull request prose (warning only)
        if: github.event_name == 'pull_request'
        run: python scripts/check_pull_request_message.py
      - name: Check external repository references
        if: github.event_name == 'pull_request'
        run: python scripts/check_external_pr_refs.py
      - name: Check dashes and ASCII in template files
        run: python scripts/check_ascii.py plan/HANDOFF.md.example SECURITY.md CONTRIBUTING.md .github/PULL_REQUEST_TEMPLATE.md .github/ISSUE_TEMPLATE.md
      - name: Check dashes and ASCII in this repo's own prose
        run: python scripts/check_ascii.py CHANGELOG.md docs/development.md docs/project-orientation.md docs/pr-security-review.md docs/pr-quality-review.md docs/template-drift.md
