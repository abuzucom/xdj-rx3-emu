name: AGENTS.md Compliance (reusable)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  advisory-pr-checks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.x'
      - name: Check commit prose (warning only)
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python scripts/check_commit_message.py
          --base "$PR_BASE_SHA"
          --head "$PR_HEAD_SHA"
      - name: Check pull request prose (warning only)
        run: python scripts/check_pull_request_message.py

  pr-checks:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.x'
      - name: Check banned-agent authorship
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python scripts/check_banned_agents.py \
            --base "$PR_BASE_SHA" \
            --head "$PR_HEAD_SHA"
      - name: Check commit identities
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python scripts/check_git_identity.py \
            --base "$PR_BASE_SHA" \
            --head "$PR_HEAD_SHA"
      - name: Check strict commit attribution
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python scripts/check_commit_attribution.py
          --repo .
          --repository "${{ github.repository }}"
          --base "$PR_BASE_SHA"
          --head "$PR_HEAD_SHA"
      - name: Check agent-attributed prose compliance
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python scripts/check_agent_prose_gate.py \
            --base "$PR_BASE_SHA" \
            --head "$PR_HEAD_SHA"
      - name: Check external repository references
        run: python scripts/check_external_pr_refs.py

  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.x'
      - name: Install checker dependencies
        run: python -m pip install --requirement requirements-checkers.txt
      - name: Check branch name
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
        run: python scripts/check_branch_name.py
      - name: Check gate adoption
        run: python scripts/check_gate_adoption.py
      - name: Probe configured hook launchers
        run: python scripts/check_hook_launchers.py
      - name: Check versioned changelog
        run: python scripts/check_changelog.py
      - name: Check changelog version advance
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/check_changelog.py --base "$PR_BASE_SHA" --head "$PR_HEAD_SHA"
      - name: Check canonical policy size
        run: python scripts/check_policy_size.py
      - name: Check persist-credentials on checkout steps
        run: python scripts/check_persist_credentials.py .github/workflows/*.yml
      - name: Check for unjustified MD5/SHA-1
        run: |
          shopt -s nullglob
          files=(scripts/*.py)
          if [ ${#files[@]} -gt 0 ]; then
            python scripts/check_weak_hashing.py "${files[@]}"
          fi
      - name: Check for non-root containers
        run: |
          shopt -s nullglob
          files=(Dockerfile* docker-compose*.yml docker-compose*.yaml compose*.yml compose*.yaml)
          if [ ${#files[@]} -gt 0 ]; then
            python scripts/check_dockerfile_root.py "${files[@]}"
          fi
      - name: Check for likely secrets
        run: |
          shopt -s nullglob
          files=(scripts/*.py .github/workflows/*.yml .pre-commit-config.yaml Makefile)
          if [ ${#files[@]} -gt 0 ]; then
            python scripts/check_secrets_heuristic.py "${files[@]}"
          fi
